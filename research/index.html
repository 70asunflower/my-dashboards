<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>科研工作台</title>
<style>
:root{
  --primary:#2059C8; --primary-light:#EAF0FB; --primary-deep:#163F8F;
  --danger:#D33; --danger-bg:#FCEBEB; --success:#2E9E5B; --success-bg:#EAF6EF;
  --warn:#E08A00; --warn-bg:#FDF3E3;
  --text:#1F2430; --text-2:#5C6472; --text-3:#9AA1AE;
  --line:#E7EAF2; --bg:#F4F6FB; --card:#fff;
  --radius:14px; --shadow:0 1px 3px rgba(31,45,90,.06),0 4px 14px rgba(31,45,90,.05);
  --ring-track:#E6EBF5; --heat-off:#E7EAF2; --heat-on:#2059C8; --ring-text:#2059C8; --heat-today:#163F8F;
  --modal-bg:#fff; --mask:rgba(15,23,42,.45);
  --tip-text:#8A5A00; --tip-border:#F5DFB4;
  --today-top:#1E4FAF; --today-bottom:#2059C8; --today-item:rgba(255,255,255,.10); --today-item-od:rgba(255,255,255,.16);
}
html[data-theme="dark"]{
  --primary:#5B8DEF; --primary-light:#1E2F52; --primary-deep:#7FA5F2;
  --danger:#F06565; --danger-bg:#3A2326; --success:#4CC38A; --success-bg:#1E342A;
  --warn:#E8A33D; --warn-bg:#33290F;
  --text:#E6EAF2; --text-2:#A6B0C0; --text-3:#6B7686;
  --line:#2A3444; --bg:#0F1520; --card:#1A2230;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --ring-track:#2A3444; --heat-off:#242E3E; --heat-on:#5B8DEF; --ring-text:#7FA5F2; --heat-today:#9DB9F5;
  --modal-bg:#1A2230; --mask:rgba(0,0,0,.62);
  --tip-text:#F0C878; --tip-border:#4A3B18;
  --today-top:#14315F; --today-bottom:#1E4FAF; --today-item:rgba(255,255,255,.08); --today-item-od:rgba(255,255,255,.14);
}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 0}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:6px 2px 14px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:42px;height:42px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
h1{font-size:20px;font-weight:600;letter-spacing:.3px}
.date-line{font-size:13px;color:var(--text-2)}
.head-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-deep);color:#fff}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn svg{flex:none}
.tip{padding:10px 14px;border-radius:10px;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;background:var(--tip-bg,#FDF3E3);color:var(--tip-text);border:1px solid var(--tip-border)}
.tip .close{margin-left:auto;cursor:pointer;background:none;border:none;color:inherit;font-size:18px;line-height:1;padding:6px}
.today{background:linear-gradient(180deg,var(--today-top),var(--today-bottom));border-radius:var(--radius);color:#fff;padding:18px;margin-bottom:18px;box-shadow:var(--shadow)}
.today h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.today .sub{font-size:13px;opacity:.85;font-weight:400}
.today-list{display:flex;flex-direction:column;gap:8px}
.t-item{display:flex;align-items:center;gap:10px;background:var(--today-item);border-radius:10px;padding:10px 12px;font-size:14px;border-left:4px solid rgba(255,255,255,.45)}
.t-item.overdue{background:var(--today-item-od);border-left-color:#FFD7D7}
.t-item .txt{flex:1;min-width:0;word-break:break-all}
.t-item .tag{font-size:12px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.2);flex:none}
.t-item.overdue .tag{background:var(--danger);color:#fff}
.t-item .do{min-height:36px;padding:0 12px;font-size:13px;border:none;border-radius:8px;background:var(--card);color:var(--primary);cursor:pointer;font-weight:600;flex:none;font-family:inherit}
.t-item.overdue .do{background:var(--danger);color:#fff}
.today .empty{font-size:14px;opacity:.85;padding:6px 2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;align-items:center;gap:10px}
.card-head .ico{width:34px;height:34px;border-radius:10px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
.card-head h3{font-size:16px;font-weight:600}
.head-link{min-height:30px;padding:0 10px;font-size:12.5px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--primary);text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.head-link:hover{border-color:var(--primary);background:var(--primary-light)}
.card-head .cnt{margin-left:auto;font-size:12px;color:var(--text-3);background:var(--bg);padding:2px 10px;border-radius:99px}
.empty{padding:18px 0;text-align:center;color:var(--text-3);font-size:14px}
/* 课题 */
.proj{position:relative;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.proj.done{opacity:.62}
.proj .p-top{display:flex;align-items:flex-start;gap:10px}
.proj .ring{flex:none}
.proj .p-name{font-size:15px;font-weight:600;word-break:break-all}
.proj .p-meta{font-size:12.5px;color:var(--text-2);margin-top:2px;display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--primary-light);color:var(--primary)}
.badge.overdue{background:var(--danger-bg);color:var(--danger)}
.badge.ok{background:var(--success-bg);color:var(--success)}
.stage-bar{display:flex;height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.stage-bar i{flex:1;border-right:2px solid var(--card)}
.stage-bar i.on{background:var(--primary)}
.stage-bar i:last-child{border-right:none}
.p-tasks{display:flex;flex-direction:column;gap:6px}
.p-task{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-2)}
.p-task input{width:18px;height:18px;accent-color:var(--primary);flex:none}
.p-task.done-t{color:var(--text-3);text-decoration:line-through}
.p-task .add-t{display:flex;gap:6px;width:100%;margin-top:2px}
.p-ops{display:flex;gap:8px;align-items:center}
.p-ops .grow{flex:1;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
.p-ops input[type=range]{flex:1;accent-color:var(--primary);min-height:24px}
.proj-actions{margin-left:auto;display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icon-btn:hover{color:var(--primary);border-color:var(--primary)}
.icon-btn.red:hover{color:var(--danger);border-color:var(--danger)}
/* 表单 */
.inline-form{display:flex;flex-direction:column;gap:10px;border:1px dashed var(--line);border-radius:12px;padding:12px}
.f-row{display:flex;flex-direction:column;gap:6px}
.f-row label{font-size:13px;color:var(--text-2)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--text);background:var(--card);font-family:inherit;outline:none}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(32,89,200,.12)}
.f-btns{display:flex;gap:8px}
/* 文献 */
.paper{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px}
.paper .p-info{flex:1;min-width:0}
.paper .p-title{font-size:14.5px;font-weight:600;word-break:break-all}
.paper .p-sub{font-size:12.5px;color:var(--text-2);margin-top:3px;word-break:break-all}
.paper .p-ops{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.p-st{display:flex;gap:4px}
.p-st button{min-height:30px;padding:0 10px;font-size:12.5px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text-2);cursor:pointer;font-family:inherit}
.p-st button.on{background:var(--primary);border-color:var(--primary);color:#fff}
/* 灵感 */
.idea{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px}
.idea .i-content{flex:1;min-width:0;font-size:14px;word-break:break-all;white-space:pre-wrap}
.idea .i-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.idea .i-tag{font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--bg);color:var(--text-2)}
.idea.converted{opacity:.6}
.idea .i-date{font-size:11.5px;color:var(--text-3);align-self:center}
.tag-hist{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag-hist .tag-hist-empty{font-size:12px;color:var(--text-3)}
.tag-chip{min-height:28px;padding:2px 10px;font-size:12.5px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--text-2);cursor:pointer;font-family:inherit}
.p-op-row{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.i-op-row{display:flex;gap:6px}
.idea .i-ops{display:flex;gap:6px;flex-direction:column;align-items:flex-end}
.tag-chip:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-light)}
/* 打卡 */
.habit{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.habit .h-name{flex:1;font-size:14.5px;font-weight:500}
.habit .h-streak{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.habit .h-check{min-height:40px;min-width:40px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--text-3);cursor:pointer;display:flex;align-items:center;justify-content:center}
.habit .h-check.on{background:var(--primary);border-color:var(--primary);color:#fff}
.heat-wrap{display:flex;justify-content:center;padding:4px 0}
.arch-wrap{margin-top:4px;display:flex;flex-direction:column;gap:6px}
.arch-toggle{width:100%;justify-content:space-between;color:var(--text-3);border-style:dashed}
.arch-list{display:none;flex-direction:column;gap:6px}
.arch-item{display:flex;align-items:center;gap:8px;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--text-3)}
.arch-item .a-name{flex:1;min-width:0;word-break:break-all;font-size:13px}
.arch-item .btn{min-height:32px;padding:0 10px;font-size:12.5px;flex:none}
.today-add{display:flex;gap:8px;margin-top:10px}
.today-add input{flex:1;min-width:0;min-height:44px;border:none;border-radius:10px;padding:0 14px;font-size:16px;background:rgba(255,255,255,.16);color:#fff;outline:none}
.today-add input::placeholder{color:rgba(255,255,255,.55)}
.today-add .do{min-height:44px;padding:0 16px;border:none;border-radius:10px;background:#fff;color:var(--primary);font-size:14px;font-weight:600;cursor:pointer;flex:none;font-family:inherit}
.t-item .x{width:30px;height:30px;border:none;border-radius:8px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);font-size:16px;line-height:1;cursor:pointer;flex:none}
.t-item .x:hover{background:var(--danger);color:#fff}
.log-date{font-size:12.5px;font-weight:600;color:var(--primary);margin:10px 0 6px;display:flex;align-items:center;gap:8px}
.log-date:first-child{margin-top:0}
.log-item{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.log-item.auto{background:var(--bg);border-style:dashed}
.log-item .log-text{flex:1;min-width:0;font-size:14px;word-break:break-all;white-space:pre-wrap;line-height:1.7}
.log-item.auto .log-text{color:var(--text-2);font-size:13px}
.log-ico{display:inline-flex;margin-right:6px;vertical-align:-2px}
.log-auto-time{font-size:11px;color:var(--text-3);align-self:center;flex:none}
.p-note{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;display:flex;flex-direction:column;gap:6px}
.p-row{font-size:12.5px;color:var(--text-2);display:flex;gap:8px;line-height:1.6}
.p-row b{flex:none;color:var(--text-3);font-weight:500;min-width:52px}
.p-row span{flex:1;min-width:0;white-space:pre-wrap;word-break:break-all}
.p-note-toggle{min-height:32px;padding:0 12px;font-size:12.5px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--primary);cursor:pointer;font-family:inherit;margin-top:6px}
.p-note-toggle:hover{border-color:var(--primary);background:var(--primary-light)}
.hint{font-size:12px;color:var(--text-3);line-height:1.5}
/* 弹窗 */
.mask{position:fixed;inset:0;background:var(--mask);display:none;align-items:flex-end;justify-content:center;z-index:99}
.mask.show{display:flex}
.modal{background:var(--modal-bg);border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:86vh;overflow:auto;padding:20px;animation:up .18s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.modal h4{font-size:16px;font-weight:600;margin-bottom:14px}
.modal .f-row{margin-bottom:12px}
footer{text-align:center;font-size:12px;color:var(--text-3);padding:22px 0 8px}
@media(min-width:768px){
  .mask{align-items:center}
  .modal{border-radius:16px}
}
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap .s-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.search-wrap input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:16px;padding:0 14px 0 40px;outline:none}
.search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(32,89,200,.12)}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:60;max-height:340px;overflow:auto;display:none}
.search-results .sr-item{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--line);cursor:pointer}
.search-results .sr-item:last-child{border-bottom:none}
.search-results .sr-item:hover{background:var(--primary-light)}
.search-results .sr-cat{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--primary-light);color:var(--primary);flex:none}
.search-results .sr-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-results .sr-empty{padding:12px 14px;font-size:13px;color:var(--text-3)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:9px;cursor:pointer}
.stat:hover{border-color:var(--primary)}
.stat .st-ico{width:30px;height:30px;border-radius:9px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
.stat .st-num{font-size:17px;font-weight:600;line-height:1.15}
.stat .st-lb{font-size:11px;color:var(--text-3)}
@keyframes flashBg{0%{background:rgba(255,200,60,.4)}100%{background:transparent}}
.flash{animation:flashBg 1.6s ease 2}
.t-more{min-height:38px;border:none;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;cursor:pointer;font-family:inherit}
.task-ratio{font-size:12px;color:var(--text-3);white-space:nowrap;margin-left:10px}
.card{transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:0 2px 6px rgba(31,45,90,.08),0 6px 20px rgba(31,45,90,.06)}
.filter-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--primary);background:var(--primary-light);border-radius:10px;padding:6px 12px}
.i-tag{cursor:pointer}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:767px){
  .wrap{padding:12px 12px 0}
  .grid{grid-template-columns:1fr}
  .head-actions{width:100%;margin-left:0;flex-wrap:wrap}
  .head-actions .btn{flex:0 0 auto;font-size:14px;padding:0 12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">
      <div class="mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M4 6h16M4 18h16M12 6c-3 0-5 2-5 4h10c0-2-2-4-5-4z"/></svg>
      </div>
      <div>
        <h1>科研工作台</h1>
        <div class="date-line" id="dateLine"></div>
      </div>
    </div>
    <div class="head-actions">
      <button class="btn" id="btnTheme" title="切换亮/暗主题"><span id="themeIco"></span></button>
      <button class="btn" id="btnSync" title="GitHub 云同步"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z"/></svg>云同步</button>
      <button class="btn" id="btnExport"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>导出 JSON 备份</button>
      <button class="btn" id="btnImport"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9m0 0l-4 4m4-4l4 4M5 3h14"/></svg>导入恢复</button>
      <button class="btn danger" id="btnWipe"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3m-9 0l1 13h10l1-13"/></svg>清空数据</button>
    </div>
  </header>

  <div class="search-wrap">
    <svg class="s-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="search" id="globalSearch" placeholder="全局搜索：课题 / 文献 / 灵感 / 日志">
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="stats" id="statsBar"></div>

  <div class="tip" id="cfgTip" style="display:none">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z"/></svg>
    <span>数据默认存云端（GitHub 私有仓库）：点右上角「云同步」配置一次，之后打开页面自动加载、改动自动保存。</span>
    <button class="close" id="cfgTipClose" aria-label="关闭">×</button>
  </div>

  <div class="tip" id="envTip" style="display:none">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5m0 3h.01"/></svg>

<script>
(function(){
"use strict";
var LS_PROJECTS="wb_research_projects", LS_PAPERS="wb_research_papers", LS_IDEAS="wb_research_ideas",
    LS_HABITS="wb_research_habits", LS_RECORDS="wb_research_records", LS_INSTALLED="wb_research_installed", LS_TIP="wb_research_tip30", LS_THEME="wb_research_theme",
    LS_GH_TOKEN="wb_research_gh_token", LS_GH_REPO="wb_research_gh_repo", LS_GH_PATH="wb_research_gh_path", LS_GH_AUTO="wb_research_gh_auto", LS_GH_LAST="wb_research_gh_last", LS_GH_LOCAL="wb_research_gh_local",
    LS_LOGS="wb_research_logs", LS_TODOS="wb_research_todos";

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function pad(n){return n<10?"0"+n:""+n}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function addDays(str,n){var p=str.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function diffDays(a,b){var pa=a.split("-"),pb=b.split("-");var A=new Date(+pa[0],+pa[1]-1,+pa[2]),B=new Date(+pb[0],+pb[1]-1,+pb[2]);return Math.round((B-A)/86400000)}
function fmtCN(str){if(!str)return "";var p=str.split("-");return (+p[1])+"月"+ (+p[2])+"日"}
function fmtShort(str){if(!str)return "";return str.slice(5).replace("-","/")}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var LS_OK=true;
try{localStorage.setItem("__wb_probe","1");localStorage.removeItem("__wb_probe")}catch(e){LS_OK=false}
function safeGet(k){try{return LS_OK?localStorage.getItem(k):null}catch(e){return null}}
function safeSet(k,v){try{if(LS_OK)localStorage.setItem(k,v)}catch(e){}}
function safeRemove(k){try{if(LS_OK)localStorage.removeItem(k)}catch(e){}}
var projects=load(LS_PROJECTS,[]), papers=load(LS_PAPERS,[]), ideas=load(LS_IDEAS,[]), habits=load(LS_HABITS,[]), records=load(LS_RECORDS,{}), logs=load(LS_LOGS,[]), todos=load(LS_TODOS,[]);

function seed(){
  projects=[];papers=[];ideas=[];habits=[];records={};logs=[];todos=[];
  save(LS_PROJECTS,projects);save(LS_PAPERS,papers);save(LS_IDEAS,ideas);save(LS_HABITS,habits);save(LS_RECORDS,records);save(LS_LOGS,logs);save(LS_TODOS,todos);
  safeSet(LS_INSTALLED,"1");
}
if(!safeGet(LS_INSTALLED)){seed()}
else{projects=load(LS_PROJECTS,[]);papers=load(LS_PAPERS,[]);ideas=load(LS_IDEAS,[]);habits=load(LS_HABITS,[]);records=load(LS_RECORDS,{});logs=load(LS_LOGS,[]);todos=load(LS_TODOS,[])}
/* 过滤旧示例数据（demo 标记），保留真实数据 */
projects=projects.filter(function(x){return !x.demo});
papers=papers.filter(function(x){return !x.demo});
ideas=ideas.filter(function(x){return !x.demo});
logs=logs.filter(function(x){return !x.demo});
todos=todos.filter(function(x){return !x.demo});

function persist(){save(LS_PROJECTS,projects);save(LS_PAPERS,papers);save(LS_IDEAS,ideas);save(LS_HABITS,habits);save(LS_RECORDS,records);save(LS_LOGS,logs);save(LS_TODOS,todos);safeSet(LS_GH_LOCAL,new Date().toISOString());scheduleAutoPush()}

/* ---------- 工具 ---------- */
function ringSVG(p){
  var c=2*Math.PI*18,off=c*(1-Math.min(100,Math.max(0,p))/100);
  var track=isDark()?"#2A3444":"#E6EBF5",on=isDark()?"#5B8DEF":"#2059C8",txt=isDark()?"#7FA5F2":"#2059C8";
  return '<svg width="48" height="48" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="'+track+'" stroke-width="4"/>'+
  '<circle cx="22" cy="22" r="18" fill="none" stroke="'+on+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 22 22)"/>'+
  '<text x="22" y="22" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="'+txt+'">'+p+'%</text></svg>';
}
var STAGES=["开题","实验","写作","投稿"];
function stageBar(s,pr){
  var h="<div class='stage-bar'>";
  for(var i=0;i<4;i++){h+="<i class='"+(i<=s?"on":"")+"'></i>"}
  return h+"</div>";
}
function heatSVG(){
  var t=todayStr(),w=Math.min(28,80);
  var x0=4,y0=4,cell=14,gap=4,cols=7;
  var on=isDark()?"#5B8DEF":"#2059C8",off=isDark()?"#242E3E":"#E7EAF2",todayStroke=isDark()?"#9DB9F5":"#163F8F";
  var wpx=cols*(cell+gap),hpx=4*(cell+gap);
  var s='<svg width="'+(wpx+8)+'" height="'+(hpx+8)+'" viewBox="0 0 '+(wpx+8)+' '+(hpx+8)+'">';
  for(var i=w-1;i>=0;i--){
    var d=addDays(t,-i),day=(w-1-i),col=day%7,row=Math.floor(day/7);
    var hit=records[d]&&Object.keys(records[d]).length>0;
    var x=x0+col*(cell+gap),y=y0+row*(cell+gap);
    s+='<rect x="'+x+'" y="'+y+'" width="'+cell+'" height="'+cell+'" rx="3" fill="'+(hit?on:off)+'" stroke="'+(i===0?todayStroke:"none")+'" stroke-width="'+(i===0?"1.5":"0")+'"/>';
  }
  return s+"</svg>";
}
function checkStreak(habitId){
  var t=todayStr(),n=0;
  if(!(records[t]&&records[t][habitId])){t=addDays(t,-1)}
  while(records[t]&&records[t][habitId]){n++;t=addDays(t,-1)}
  return n;
}
function totalUserData(){return projects.filter(function(p){return !p.demo}).length+papers.filter(function(p){return !p.demo}).length+ideas.filter(function(p){return !p.demo}).length}

/* ---------- 今日要处理 ---------- */
function todayItems(){
  var t=todayStr(),items=[];
  projects.forEach(function(p){
    if(p.done||p.archived)return;
    if(p.deadline&&p.deadline<=t){
      var d=diffDays(p.deadline,t);
      items.push({cls:"overdue",tag:"逾期",txt:'课题「'+p.name+'」'+(d===0?"今天到期":"已逾期 "+d+" 天"),do:"推进阶段",fn:function(){advance(p.id)}});
    }else if(p.deadline){
      var dd=diffDays(t,p.deadline);
      if(dd<=3){items.push({cls:"due",tag:"快到期",txt:'课题「'+p.name+'」还有 '+dd+' 天到期',do:"推进阶段",fn:function(){advance(p.id)}})}
    }
    (p.tasks||[]).forEach(function(k){
      if(!k.done){items.push({cls:"task",tag:"任务",txt:'任务「'+k.text+'」 · '+p.name,do:"完成",fn:function(){k.done=true;persist();render()}})}
    });
  });
  papers.forEach(function(pp){
    if(!pp.archived&&pp.status==="待读"&&pp.deadline&&pp.deadline<=t){
      items.push({cls:"overdue",tag:"文献",txt:'文献「'+pp.title+'」待读已逾期',do:"标为在读",fn:function(){pp.status="在读";persist();render()}});
    }
  });
  todos.filter(function(x){return !x.done}).forEach(function(td){
    items.push({cls:"todo",tag:"待办",txt:td.text,do:"完成",fn:function(){td.done=true;logEvent("todo",'完成待办「'+td.text+'」');persist();render()},del:function(){todos=todos.filter(function(x){return x.id!==td.id});persist();render()}});
  });
  return items;
}
function renderToday(){
  var box=document.getElementById("todayList"),items=todayItems();
  if(!items.length){box.innerHTML='<div class="empty">今天没有待处理项，去推进课题或读篇文献吧</div>';return}
  var list=_todayFull?items:items.slice(0,8),more=items.length-8;
  box.innerHTML=list.map(function(it,i){
    var del=it.del?'<button class="x" data-x="'+i+'" title="删除">×</button>':"";
    return '<div class="t-item '+it.cls+'"><span class="tag">'+it.tag+'</span><span class="txt">'+esc(it.txt)+'</span>'+del+'<button class="do" data-k="'+i+'">'+it.do+'</button></div>';
  }).join("")+(more>0&&!_todayFull?'<button class="t-more" id="tMore">还有 '+more+' 条，展开全部</button>':"");
  box.querySelectorAll(".do").forEach(function(b){
    b.addEventListener("click",function(){items[+b.getAttribute("data-k")].fn()});
  });
  box.querySelectorAll("[data-x]").forEach(function(b){
    b.addEventListener("click",function(){items[+b.getAttribute("data-x")].del()});
  });
  var moreBtn=box.querySelector("#tMore");
  if(moreBtn)moreBtn.addEventListener("click",function(){_todayFull=true;renderToday()});
}
function advance(id){
  var p=projects.find(function(x){return x.id===id});if(!p)return;
  if(p.done){p.done=false;p.archived=false;persist();render();return}
  if(p.stage<3){
    p.stage++;
    logEvent("project",'课题「'+p.name+'」推进至「'+STAGES[p.stage]+'」阶段');
    if(p.stage===3){p.deadline=addDays(todayStr(),14)}
    else if(p.deadline&&p.deadline<todayStr()){p.deadline=addDays(todayStr(),14)}
  }else{p.done=true;p.archived=true;logEvent("project",'完成课题「'+p.name+'」')}
  persist();render();
}

/* ---------- 课题 ---------- */
function renderProjects(){
  var el=document.getElementById("projList");
  var list=projects.filter(function(x){return !x.archived});
  document.getElementById("projCnt").textContent=list.length+" 个";
  if(!list.length){el.innerHTML='<div class="empty">没有进行中的课题，点击下方「新增课题」开始</div>';return}
  el.innerHTML=list.map(function(p){
    var t="<div class='proj"+(p.done?" done":"")+"'><div class='p-top'><span data-pring='"+p.id+"'>"+ringSVG(p.progress)+"</span>"+
    "<div style='flex:1;min-width:0'><div class='p-name'>"+esc(p.name)+(p.done?"<span class='badge ok'>已完成</span>":"")+"</div>"+
    "<div class='p-meta'><span class='badge"+(p.deadline&&p.deadline<=todayStr()&&!p.done?" overdue":"")+"'>"+STAGES[p.stage]+"</span>"+
    (p.deadline?"<span class='badge"+(p.deadline<=todayStr()&&!p.done?" overdue":"")+"'>截止 "+fmtCN(p.deadline)+"</span>":"")+"</div></div>"+
    "<div class='proj-actions'>"+
    "<button class='icon-btn' title='归档' data-a='arch' data-id='"+p.id+"'><svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 8V21H3V8M1 3h22v5H1zM10 12h4'/></svg></button>"+
    "<button class='icon-btn' title='编辑' data-a='edit' data-id='"+p.id+"'><svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z'/></svg></button>"+
    "<button class='icon-btn red' title='删除' data-a='del' data-id='"+p.id+"'><svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'><path d='M4 7h16M9 7V4h6v3m-9 0l1 13h10l1-13'/></svg></button></div></div>";
    t+="<div class='stage-bar-wrap'>"+stageBar(p.stage,p.progress)+"</div>";
    t+="<div class='p-tasks'>"+(p.tasks||[]).map(function(k){
      return "<label class='p-task"+(k.done?" done-t":"")+"'><input type='checkbox' data-t='"+k.id+"' data-p='"+p.id+"'"+(k.done?" checked":"")+">"+esc(k.text)+"</label>";
    }).join("")+
    "<div class='add-t'><input type='text' placeholder='加个任务…' data-pt='"+p.id+"' style='flex:1;min-height:40px'><button class='btn sm' data-ptb='"+p.id+"'>添加</button></div></div>";
    t+="<div class='p-ops'><span class='grow'>进度 <input type='range' min='0' max='100' step='5' value='"+p.progress+"' data-pg='"+p.id+"'> <b data-pv='"+p.id+"'>"+p.progress+"%</b>"+
    (p.tasks&&p.tasks.length?"<span class='task-ratio'>任务 "+(p.tasks.filter(function(x){return x.done}).length)+"/"+p.tasks.length+"</span>":"")+"</span></div>";
    t+="<div class='p-ops'><button class='btn primary sm' style='flex:1' data-adv='"+p.id+"'>"+(p.done?"重新打开":"下一阶段 · "+ (p.stage<3?STAGES[p.stage+1]:"完成课题"))+"</button></div></div>";
    return t;
  }).join("");
  el.querySelectorAll("input[type=checkbox][data-t]").forEach(function(c){
    c.addEventListener("change",function(){
      var p=projects.find(function(x){return x.id===c.getAttribute("data-p")});
      var k=(p.tasks||[]).find(function(x){return x.id===c.getAttribute("data-t")});
      if(k){
        var was=k.done;
        k.done=c.checked;
        if(!was&&k.done)logEvent("task",'完成任务「'+k.text+'」 · '+p.name);
        persist();render();
      }
    });
  });
  el.querySelectorAll("input[data-pt]").forEach(function(i){
    i.addEventListener("keydown",function(e){if(e.key==="Enter"){addTask(i.getAttribute("data-pt"),i.value);i.value=""}});
  });
  el.querySelectorAll("button[data-ptb]").forEach(function(b){
    b.addEventListener("click",function(){
      var inp=el.querySelector("input[data-pt='"+b.getAttribute("data-ptb")+"']");
      addTask(b.getAttribute("data-ptb"),inp.value);inp.value="";
    });
  });
  el.querySelectorAll("input[data-pg]").forEach(function(r){
    r.addEventListener("input",function(){
      var p=projects.find(function(x){return x.id===r.getAttribute("data-pg")});
      p.progress=+r.value;
      var v=el.querySelector("b[data-pv='"+p.id+"']");if(v)v.textContent=p.progress+"%";
      var wrap=el.querySelector("[data-pring='"+p.id+"']");
      if(wrap){
        var circ=2*Math.PI*18,off=circ*(1-p.progress/100);
        var c=wrap.querySelectorAll("circle")[1];
        if(c)c.setAttribute("stroke-dashoffset",off.toFixed(1));
        var t=wrap.querySelector("text");if(t)t.textContent=p.progress+"%";
      }
    });
    r.addEventListener("change",function(){persist()});
  });
  el.querySelectorAll("[data-adv]").forEach(function(b){b.addEventListener("click",function(){advance(b.getAttribute("data-adv"))})});
  el.querySelectorAll("[data-a='edit']").forEach(function(b){b.addEventListener("click",function(){editProject(b.getAttribute("data-id"))})});
  el.querySelectorAll("[data-a='arch']").forEach(function(b){b.addEventListener("click",function(){var p=projects.find(function(x){return x.id===b.getAttribute("data-id")});if(p){p.archived=true;persist();render()}})});
  el.querySelectorAll("[data-a='del']").forEach(function(b){b.addEventListener("click",function(){delProject(b.getAttribute("data-id"))})});
}
function addTask(pid,text){
  text=(text||"").trim();if(!text)return;
  var p=projects.find(function(x){return x.id===pid});if(!p)return;
  p.tasks=p.tasks||[];p.tasks.push({id:uid(),text:text,done:false});persist();render();
}
function delProject(id){
  var p=projects.find(function(x){return x.id===id});

}

    ta("方法（核心方法）","mMethod",p.method,"如：恒等捷径连接堆叠残差块…")+

/* ---------- 文献 ---------- */
function tmplRows(p){
  var rows=[["问题",p.q],["条件",p.cond],["方法",p.method],["判据",p.crit],["结论",p.concl],["局限",p.limit],["与我的关系",p.relation],["出处",p.source]];
  return rows.filter(function(r){return r[1]&&(r[1]+"").trim()}).map(function(r){
    return '<div class="p-row"><b>'+r[0]+'</b><span>'+esc(r[1])+'</span></div>';
  }).join("");
}
function tmplCount(p){
  return [p.q,p.cond,p.method,p.crit,p.concl,p.limit,p.relation,p.source].filter(function(x){return x&&(x+"").trim()}).length;
}

function systemDark(){return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches}
function isDark(){return document.documentElement.getAttribute("data-theme")==="dark"}

  var t=(mode==="dark"||(!mode&&systemDark()))?"dark":"light";
  document.documentElement.setAttribute("data-theme",t);

}

/* ---------- 备份 ---------- */
function exportAll(){
  var data={version:1,exportedAt:todayStr(),
    projects:projects,papers:papers,ideas:ideas,habits:habits,records:records};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="科研工作台备份_"+todayStr()+".json";document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},100);
}
function importAll(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||typeof d!=="object"){alert("文件格式不正确");return}
      if(Array.isArray(d.projects)){projects=d.projects;save(LS_PROJECTS,projects)}
      if(Array.isArray(d.papers)){papers=d.papers;save(LS_PAPERS,papers)}
      if(Array.isArray(d.ideas)){ideas=d.ideas;save(LS_IDEAS,ideas)}
      if(Array.isArray(d.habits)){habits=d.habits;save(LS_HABITS,habits)}
      if(d.records&&typeof d.records==="object"){records=d.records;save(LS_RECORDS,records)}
      safeSet(LS_INSTALLED,"1");
      alert("导入成功，共恢复：课题 "+projects.length+" · 文献 "+papers.length+" · 灵感 "+ideas.length);
      render();
    }catch(e){alert("导入失败：文件不是有效的 JSON 备份")}
  };
  r.readAsText(file);
}

    '<div class="f-btns"><button class="btn danger" id="mOk">确认清空</button><button class="btn" id="mCancel">取消</button></div>',
    function(){
      [LS_PROJECTS,LS_PAPERS,LS_IDEAS,LS_HABITS,LS_RECORDS,LS_LOGS,LS_TODOS,LS_INSTALLED,LS_TIP,LS_THEME].forEach(function(k){safeRemove(k)});
      location.reload();
    });
}

function renderStats(){
  var bar=document.getElementById("statsBar");if(!bar)return;
  var proj=projects.filter(function(x){return !x.done&&!x.archived}).length;
  var paper=papers.filter(function(x){return !x.archived&&x.status==="待读"}).length;
  var now=new Date(),dow=(now.getDay()+6)%7,monday=addDays(todayStr(),-dow);

/* ---------- GitHub 云同步 ---------- */
function ghHeaders(t){return{"Authorization":"Bearer "+t,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}}
function toB64(str){
  var bytes=new TextEncoder().encode(str),bin="";
  for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function fromB64(b64){
  var bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function getSyncCfg(){
  return{token:safeGet(LS_GH_TOKEN)||"",repo:safeGet(LS_GH_REPO)||"",path:safeGet(LS_GH_PATH)||"data/research.json",auto:safeGet(LS_GH_AUTO)!=="0",last:safeGet(LS_GH_LAST)||""};
}
function buildBackup(){return{version:1,exportedAt:new Date().toISOString(),projects:projects,papers:papers,ideas:ideas,habits:habits,records:records,logs:logs,todos:todos}}
function applyBackup(d){
  projects=Array.isArray(d.projects)?d.projects:[];
  papers=Array.isArray(d.papers)?d.papers:[];
  ideas=Array.isArray(d.ideas)?d.ideas:[];
  habits=Array.isArray(d.habits)?d.habits:[];
  records=(d.records&&typeof d.records==="object")?d.records:{};
  logs=Array.isArray(d.logs)?d.logs:[];
  todos=Array.isArray(d.todos)?d.todos:[];
  save(LS_PROJECTS,projects);save(LS_PAPERS,papers);save(LS_IDEAS,ideas);save(LS_HABITS,habits);save(LS_RECORDS,records);save(LS_LOGS,logs);save(LS_TODOS,todos);
}
function getFileSha(cfg){
  return fetch("https://api.github.com/repos/"+cfg.repo+"/contents/"+encodeURIComponent(cfg.path),{headers:ghHeaders(cfg.token)})
    .then(function(r){
      if(r.status===404)return null;
      if(!r.ok)throw new Error("HTTP "+r.status+(r.status===401?"（Token 无效）":r.status===403?"（权限不足，检查 token 是否授权该仓库）":""));
      return r.json().then(function(j){return j.sha});
    });
}
function syncPush(cfg){
  var data=buildBackup(),content=toB64(JSON.stringify(data,null,1));
  return getFileSha(cfg).then(function(sha){
    var body={message:"科研工作台同步 "+todayStr()+" "+new Date().toTimeString().slice(0,8),content:content};
    if(sha)body.sha=sha;
    return fetch("https://api.github.com/repos/"+cfg.repo+"/contents/"+encodeURIComponent(cfg.path),
      {method:"PUT",headers:ghHeaders(cfg.token),body:JSON.stringify(body)});
  }).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    safeSet(LS_GH_LAST,new Date().toISOString());
    return "推送成功";
  });
}
function syncPull(cfg){
  return fetch("https://api.github.com/repos/"+cfg.repo+"/contents/"+encodeURIComponent(cfg.path),{headers:ghHeaders(cfg.token)})
    .then(function(r){
      if(r.status===404)throw new Error("云端还没有备份文件，请先「推送到云端」");
      if(!r.ok)throw new Error("HTTP "+r.status+(r.status===401?"（Token 无效）":r.status===403?"（权限不足）":""));
      return r.json();
    }).then(function(j){
      var d=JSON.parse(fromB64(j.content));
      if(!d||typeof d!=="object")throw new Error("云端数据格式不正确");
      applyBackup(d);
      return "已恢复云端数据（课题 "+projects.length+" · 文献 "+papers.length+" · 灵感 "+ideas.length+"）";
    });
}
function autoPull(){
  var cfg=getSyncCfg();
  if(!cfg.token||!cfg.repo)return;
  fetch("https://api.github.com/repos/"+cfg.repo+"/contents/"+encodeURIComponent(cfg.path),{headers:ghHeaders(cfg.token)})
    .then(function(r){if(r.status===404)return null;if(!r.ok)return null;return r.json()})
    .then(function(j){
      if(!j||!j.content)return;
      try{
        var d=JSON.parse(fromB64(j.content));
        if(!d||typeof d!=="object")return;
        // 本地有未推送的修改时跳过自动覆盖，避免数据丢失
        var localTs=safeGet(LS_GH_LOCAL);
        var cloudTs=d.exportedAt;
        if(localTs&&cloudTs&&new Date(localTs).getTime()>new Date(cloudTs).getTime()){
          setSyncStatus&&setSyncStatus("本地有未推送的修改，已跳过自动覆盖（改动会在 5 秒后自动推送）");
          return;
        }
        applyBackup(d);
        render();
      }catch(e){}
    }).catch(function(){});
}
var _autoTimer=null,_skipAuto=false,LOG_LIMIT=60,_todayFull=false,activeTag="",paperLimit=50,ideaLimit=50,_archOpen={proj:false,paper:false,idea:false},_archLimit={proj:20,paper:20,idea:20};
function withRetry(fn,times){
  return new Promise(function(resolve,reject){
    function attempt(n){
      fn().then(resolve).catch(function(e){
        if(n<times){setTimeout(function(){attempt(n+1)},1200)}
        else{reject(e)}
      });
    }
    attempt(0);
  });
}
function autoSyncEnabled(){
  var cfg=getSyncCfg();
  return cfg.auto&&cfg.token&&cfg.repo;
}
function scheduleAutoPush(){
  if(_skipAuto)return;
  if(!autoSyncEnabled())return;
  if(_autoTimer)clearTimeout(_autoTimer);
  _autoTimer=setTimeout(function(){
    var cfg=getSyncCfg();
    if(!cfg.token||!cfg.repo)return;
    syncPush(cfg).catch(function(){});
  },5000);
}

  pushBtn.addEventListener("click",function(){

    busy(pushBtn,true);setSyncStatus("正在推送到云端…");
    withRetry(function(){return syncPush({token:c.t,repo:c.r,path:c.p})},2)
      .then(function(msg){setSyncStatus(msg+" "+(new Date().toLocaleString()))})
      .catch(function(e){setSyncStatus("推送失败："+e.message+"（可稍后重试或改用导出 JSON 备份）")})
      .finally(function(){busy(pushBtn,false)});

  pullBtn.addEventListener("click",function(){

      .finally(function(){busy(pullBtn,false);setTimeout(function(){_skipAuto=false},1500)});

  document.getElementById("ghAuto").addEventListener("change",function(){safeSet(LS_GH_AUTO,this.checked?"1":"0")});

/* ---------- 缓存版本检测：检测到新版本提示刷新 ---------- */
var WB_VER="20260808-1";
function checkVersion(){
  if(location.protocol!=="https:")return;
  // 10 分钟内不重复检测，避免每次打开都拉取全页（85KB+）
  var lastCheck=+sessionStorage.getItem("wb_ver_check_ts")||0;
  if(Date.now()-lastCheck<600000)return;
  sessionStorage.setItem("wb_ver_check_ts",Date.now());
  fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.text()}).then(function(txt){
    var m=txt.match(/WB_VER\s*=\s*"([^"]+)"/);
    if(m&&m[1]&&m[1]!==WB_VER){
      if(sessionStorage.getItem("wb_ver_shown")===m[1])return;
      sessionStorage.setItem("wb_ver_shown",m[1]);
      var bar=document.createElement("div");bar.id="verTip";
      bar.style.cssText="position:fixed;top:0;left:0;right:0;z-index:10000;background:var(--primary,#2059C8);color:#fff;text-align:center;padding:9px 12px;font-size:13px;cursor:pointer;font-family:inherit";
      bar.textContent="🔄 检测到新版本（"+m[1]+"），点击刷新";
      bar.onclick=function(){location.href=location.pathname+"?v="+Date.now()};
      document.body.appendChild(bar);
    }
  }).catch(function(){});
}

  }else{
    autoPull();
  }
  if(window.matchMedia){
    var mq=matchMedia("(prefers-color-scheme: dark)");
    mq.addEventListener("change",function(){
      if(!safeGet(LS_THEME)){applyTheme("");syncThemeIcon();render()}
    });
  }
  document.getElementById("dateLine").textContent=fmtCN(todayStr())+" 星期"+"日一二三四五六".charAt(new Date().getDay());
  document.getElementById("btnExport").addEventListener("click",exportAll);
  document.getElementById("btnImport").addEventListener("click",function(){document.getElementById("importFile").click()});
  document.getElementById("importFile").addEventListener("change",function(){if(this.files&&this.files[0]){importAll(this.files[0]);this.value=""}});
  document.getElementById("btnWipe").addEventListener("click",wipeAll);
  document.getElementById("tip30close").addEventListener("click",function(){safeSet(LS_TIP,"1");renderTip()});
  bindToggle("projAdd","projForm");bindCancel("projCancel","projForm");
  bindToggle("paperAdd","paperForm");bindCancel("paperCancel","paperForm");
  document.getElementById("projSave").addEventListener("click",function(){
    var n=document.getElementById("projName").value.trim();
    if(!n){alert("请填写课题名称");return}
    projects.unshift({id:uid(),name:n,stage:+document.getElementById("projStage").value,progress:0,
      deadline:document.getElementById("projDeadline").value||"",done:false,tasks:[]});
    persist();render();
    document.getElementById("projForm").style.display="none";
    document.getElementById("projName").value="";document.getElementById("projDeadline").value="";
  });
  document.getElementById("paperSave").addEventListener("click",function(){
    var t=document.getElementById("paperTitle").value.trim();
    if(!t){alert("请填写文献标题");return}
    papers.unshift({id:uid(),title:t,tag:document.getElementById("paperTag").value.trim(),
      status:"待读",deadline:document.getElementById("paperDeadline").value||""});
    persist();render();
    document.getElementById("paperForm").style.display="none";
    ["paperTitle","paperTag","paperDeadline"].forEach(function(i){document.getElementById(i).value=""});
  });
  document.getElementById("ideaSave").addEventListener("click",function(){
    var c=document.getElementById("ideaText").value.trim();
    if(!c){alert("先写下点什么吧");return}
    ideas.unshift({id:uid(),content:c,tags:document.getElementById("ideaTag").value.trim(),date:todayStr(),converted:false});
    persist();render();
    document.getElementById("ideaText").value="";document.getElementById("ideaTag").value="";
  });
  document.getElementById("todayTodoAdd").addEventListener("click",addTodo);
  document.getElementById("todayTodoInput").addEventListener("keydown",function(e){if(e.key==="Enter"){addTodo()}});
  document.getElementById("globalSearch").addEventListener("input",renderSearch);
  document.addEventListener("click",function(e){
    var sw=document.querySelector(".search-wrap");
    if(sw&&!sw.contains(e.target))document.getElementById("searchResults").style.display="none";
  });
  document.getElementById("logSave").addEventListener("click",function(){
    var c=document.getElementById("logText").value.trim();
    if(!c){alert("先写下点什么吧");return}
    var d=document.getElementById("logDate").value||todayStr();
    logs.unshift({id:uid(),date:d,content:c,ts:Date.now(),source:"manual"});
    persist();render();
    document.getElementById("logText").value="";document.getElementById("logDate").value="";
  });
  document.getElementById("mask").addEventListener("click",function(e){if(e.target===this)closeModal()});
  render();
}
document.addEventListener("DOMContentLoaded",init);
})();
</script>
</body>
</html>
